name: Build APK

# Every push to main (or a manual run) rebuilds the APK and refreshes the
# rolling "latest" release. Pushing a tag like v0.3.0 cuts a versioned release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for this build (e.g. 0.3.0). Leave blank to keep the one in app/build.gradle.kts."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK, so use it directly and
      # just add the packages this project needs. (android-actions/setup-android
      # is avoided on purpose: its `sdkmanager tools` call fails on current
      # images, where that package no longer exists.)
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(ls -1d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$SDKMGR" ]; then
            echo "::error title=No sdkmanager::Could not find sdkmanager under $SDK"
            exit 1
          fi
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # versionCode must go up on every build or Android refuses the update.
      # 1000 + run number keeps it above the 2 that is already installed and
      # never repeats.
      - name: Work out version
        id: ver
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          NAME=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION_NAME" ]; then
            NAME="$INPUT_VERSION_NAME"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$CODE versionName=${NAME:-<from build.gradle.kts>}"

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/release-keystore.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "path=$KS" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore restored."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No signing key::ANDROID_KEYSTORE_BASE64 is not set, so this build is debug-signed. A debug-signed APK cannot install over a previous install. Add the four ANDROID_* secrets to enable real signing."
          fi

      - name: Build APK
        id: build
        env:
          MESHLINE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MESHLINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MESHLINE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MESHLINE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VC: ${{ steps.ver.outputs.code }}
          VN: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          ARGS="-PversionCodeOverride=$VC"
          if [ -n "${VN:-}" ]; then ARGS="$ARGS -PversionNameOverride=$VN"; fi

          if [ -n "${MESHLINE_KEYSTORE_PATH:-}" ]; then
            gradle --no-daemon --stacktrace assembleRelease $ARGS
            SRC=app/build/outputs/apk/release
            VARIANT=release
          else
            gradle --no-daemon --stacktrace assembleDebug $ARGS
            SRC=app/build/outputs/apk/debug
            VARIANT=debug
          fi

          mkdir -p dist
          APK=$(ls -1 $SRC/*.apk | head -n 1)
          NAME="chatbit-${VN:-$VC}-vc$VC-$VARIANT.apk"
          cp "$APK" "dist/$NAME"
          echo "file=dist/$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbit-apk-vc${{ steps.ver.outputs.code }}
          path: dist/*.apk
          retention-days: 90

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VC: ${{ steps.ver.outputs.code }}
          VN: ${{ steps.ver.outputs.name }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"; else TAG="latest"; fi

          NOTES="versionCode $VC, built from $GITHUB_SHA."
          if [ "$SIGNED" = "true" ]; then
            NOTES="$NOTES Signed with the project release key, so it installs over the previous version."
          else
            NOTES="$NOTES Debug-signed: uninstall the old app first, it cannot update in place."
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.apk --title "ChatBit $TAG" --notes "$NOTES"
          fi
          echo "Published to release: $TAG"
